<body>
<canvas id="scene" tabindex="0" aria-label="싱잉볼. 화면을 누른 채 끌어서 막대로 종을 치세요. 스페이스 키로도 칠 수 있어요"></canvas>
<p class="note" id="note" hidden></p>

<div class="band" id="band">
  <div class="picker" id="picker" aria-label="싱잉볼 선택, 옆으로 넘기세요">
    <span class="pad"></span>
    <button id="pick-dawn" data-i="0" aria-current="true">새벽</button>
    <button id="pick-clear" data-i="1" aria-current="false">맑음</button>
    <button id="pick-forest" data-i="2" aria-current="false">숲</button>
    <span class="pad"></span>
  </div>
  <p class="spec" id="spec">티베트 황동 싱잉볼 · 174Hz · 새벽 6시</p>
  <div class="dots" id="dots"><i class="on"></i><i></i><i></i></div>
  <div class="opts">
  <div class="dur" id="dur" role="radiogroup" aria-label="명상 시간">
    <button id="dur-30" role="radio" data-s="30" aria-checked="true">30초</button>
    <button id="dur-60" role="radio" data-s="60" aria-checked="false">1분</button>
    <button id="dur-180" role="radio" data-s="180" aria-checked="false">3분</button>
    <button id="dur-300" role="radio" data-s="300" aria-checked="false">5분</button>
  </div>
  <button class="rain" id="rain" aria-pressed="false"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3.5 9.5a3 3 0 0 1 .4-6 4 4 0 0 1 7.6 1 2.5 2.5 0 0 1 .5 5z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M5 11.5l-.7 2M8 11.5l-.7 2M11 11.5l-.7 2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>빗소리</button>
  </div>
  <p class="guide" id="guide" aria-live="polite">막대를 끌어서 종을 쳐 보세요</p>
  <p class="sub" id="sub">테두리를 천천히 문지르면 종이 길게 노래해요</p>
  <button class="stop" id="stop" hidden>그만하기</button>
  <p class="copy">© 2026 @bunt.0_0</p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="app.js"></script>
</body>
